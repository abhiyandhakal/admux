[package]
name = "admux"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
clap = { version = "4.5.45", features = ["derive"] }
crossterm = "0.28.1"
hostname = "0.4.1"
libc = "0.2.183"
portable-pty = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
time = { version = "0.3.44", features = ["formatting", "local-offset"] }
toml = "0.9.5"
toml_edit = "0.25.12"
unicode-segmentation = "1.10.1"
unicode-width = "0.2.2"
vt100 = "0.16.2"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.23.0"
